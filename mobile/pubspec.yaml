name: geo_attendance_mobile
description: GeoFence Attendance Mobile Application - Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation
  go_router: ^14.0.0
  
  # HTTP Client
  dio: ^5.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Location & Permissions
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Utilities
  connectivity_plus: ^5.0.0
  package_info_plus: ^5.0.0
  device_info_plus: ^9.1.0
  intl: ^0.18.0
  
  # Biometric Authentication
  local_auth: ^2.1.7
  
  # Secure Database/Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
