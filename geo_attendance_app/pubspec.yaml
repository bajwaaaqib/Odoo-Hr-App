name: geo_attendance_app
description: A secure, dynamic GeoFence attendance mobile app with Odoo integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage (Secure)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Geolocation
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # UI & Utilities
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  
  # Security
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
